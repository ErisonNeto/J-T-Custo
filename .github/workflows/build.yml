name: Build do painel de Custo
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/custo-real-postgres]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
